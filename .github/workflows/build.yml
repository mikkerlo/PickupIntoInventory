name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # No Minecraft and no dependencies: the protocol model is plain Java, so it runs before
      # anything is fetched and fails fast if the reasoning behind PIISync has been broken.
      - name: Protocol model
        run: tools/protocol/run.sh

      # Both caches are keyed on ci/fetch-deps.sh, which holds the pinned versions and
      # SHA-1s; bumping a dependency there invalidates the downloads and the remap together.
      - name: Cache dependency jars
        uses: actions/cache@v6
        with:
          path: build/deps
          key: deps-${{ hashFiles('ci/fetch-deps.sh') }}

      - name: Cache SRG-remapped Minecraft and Forge
        uses: actions/cache@v6
        with:
          path: build/tools
          key: srg-${{ hashFiles('ci/fetch-deps.sh', 'tools/Remap.java') }}

      - name: Fetch dependencies
        run: ci/fetch-deps.sh

      - name: Build
        run: |
          source build/deps/env.sh
          ./build.sh

      # Compiles the live PIIState against Forge and runs both persistence harnesses. It needs
      # the fetched jars (run.sh sources build/deps/env.sh itself), so it cannot sit beside the
      # protocol model above; it runs after the build so a broken compile is reported first.
      - name: Persistence harnesses
        run: tools/persist/run.sh

      - uses: actions/upload-artifact@v7
        with:
          name: pickupintoinventory
          path: build/pickupintoinventory-*.jar
          if-no-files-found: error

  release:
    # Pushes to main only. resources/mcmod.info is the single source of truth for the
    # version: when it names one that has no tag yet, that push is the release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two pushes landing together must not race to publish the same version.
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Decide whether this is a new version
        id: check
        run: |
          ver=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' resources/mcmod.info | head -1)
          if [ -z "$ver" ]; then
            echo "could not read version from resources/mcmod.info" >&2
            exit 1
          fi
          case "$ver" in
            [0-9]*) ;;
            *) echo "version '$ver' should start with a digit" >&2; exit 1 ;;
          esac
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$ver")" ]; then
            echo "v$ver is already tagged - nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$ver has no tag yet - releasing it"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.check.outputs.release == 'true'
        with:
          name: pickupintoinventory
          path: dist

      - name: Tag the commit and publish the release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.check.outputs.version }}
        run: |
          gh release create "v$VER" dist/*.jar \
            --target "$GITHUB_SHA" \
            --title "v$VER" \
            --generate-notes
